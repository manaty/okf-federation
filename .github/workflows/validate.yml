name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: >-
          python scripts/validate.py
          examples/minimal/workspace/home/federation.yaml
          --workspace examples/minimal/workspace
          --today 2026-08-13
      - run: python -m unittest discover -s tests -v
